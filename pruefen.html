<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zusatzverben prüfen – ¡Conjuga!</title>
  <meta name="robots" content="noindex">
  <style>
:root {
  --hintergrund: #f6f1e9;
  --karte: #ffffff;
  --text: #2b2118;
  --text-leise: #6b5d50;
  --linie: #e6ddd0;
  --haupt: #c2410c;
  --haupt-dunkel: #9a3412;
  --haupt-hell: #fff1e8;
  --sonne: #f2b134;
  --gut: #15803d;
  --gut-hell: #e9f8ee;
  --fehler: #b42318;
  --fehler-hell: #fdeceb;
  --info-hell: #eef4fb;
  --info: #1e4f86;
  --radius: 18px;
  --schatten: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 20px rgba(60, 40, 20, .07);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--hintergrund);
  color: var(--text);
  line-height: 1.5;
  font-size: 1rem;
}
[hidden] { display: none !important; }
.unsichtbar { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.rahmen { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }

/* Kopf */
.kopf { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
.marke { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 48px; height: 48px; border-radius: 14px; background: var(--haupt); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 30px; line-height: 1;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.15);
}
h1 { margin: 0; font-size: 1.5rem; line-height: 1.1; letter-spacing: -.01em; }
.untertitel { margin: 2px 0 0; color: var(--text-leise); font-size: .95rem; }

.codebox { background: var(--karte); border: 1px solid var(--linie); border-radius: 14px; padding: 8px 10px 8px 14px; }
.codebox-label { display: block; font-size: .75rem; color: var(--text-leise); text-transform: uppercase; letter-spacing: .06em; }
.codebox-zeile { display: flex; align-items: center; gap: 10px; }
.code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 1.05rem; letter-spacing: .06em; }
.code.gross { font-size: 1.4rem; text-align: center; background: var(--haupt-hell); padding: 10px; border-radius: 12px; }

/* Karten */
.karte { background: var(--karte); border-radius: var(--radius); box-shadow: var(--schatten); padding: 18px 20px; margin-bottom: 16px; }

/* Status */
.status-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.level-abzeichen { background: var(--haupt); color: #fff; font-weight: 700; border-radius: 999px; padding: 3px 12px; font-size: .95rem; white-space: nowrap; }
.level-titel { font-weight: 600; }
.level-hinweis { margin: 8px 0 0; padding: 8px 12px; background: var(--info-hell); color: var(--info); border-radius: 10px; font-size: .9rem; }
.fortschritt { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 14px 0 6px; }
.fortschritt span { height: 12px; border-radius: 6px; background: var(--linie); transition: background .25s, transform .25s; }
.fortschritt span.voll { background: var(--sonne); }
.fortschritt span.neu { transform: scaleY(1.4); }
.fortschritt-text { margin: 0; font-size: .95rem; }
.statistik { margin: 4px 0 0; font-size: .85rem; color: var(--text-leise); }

/* Aufgabe */
.aufgabe-karte { padding-top: 22px; }
.markierung { display: inline-block; margin: 0 0 6px; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--info); background: var(--info-hell); padding: 2px 10px; border-radius: 999px; }
.aufgabe { margin: 0 0 16px; font-size: clamp(1.6rem, 6.5vw, 2.3rem); line-height: 1.25; overflow-wrap: anywhere; }
.aufgabe .pron { color: var(--text-leise); font-weight: 500; }
.aufgabe .inf { font-weight: 800; }
.aufgabe .pfeil { color: var(--haupt); font-weight: 700; }
.aufgabe .zusatz { display: block; font-size: .95rem; color: var(--text-leise); font-weight: 400; margin-top: 2px; }

.antwort-form { display: flex; gap: 10px; }
#antwort {
  flex: 1; min-width: 0; font-size: 1.4rem; padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--linie); background: #fffdfa; color: var(--text); font-family: inherit;
}
#antwort:focus { outline: none; border-color: var(--haupt); box-shadow: 0 0 0 4px rgba(194, 65, 12, .15); }
#antwort.ist-richtig { border-color: var(--gut); background: var(--gut-hell); }
#antwort.ist-falsch { border-color: var(--fehler); background: var(--fehler-hell); }
#antwort[readonly] { cursor: default; }
.wackeln { animation: wackeln .35s; }
@keyframes wackeln { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.akzente { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.akzent {
  min-width: 46px; min-height: 42px; font-size: 1.2rem; border-radius: 10px; border: 1px solid var(--linie);
  background: #fff; color: var(--text); cursor: pointer; font-family: inherit;
}
.akzent:hover { background: var(--haupt-hell); }
.akzent-info { font-size: .85rem; color: var(--text-leise); margin-left: 4px; }

.rueckmeldung:empty { display: none; }
.rueckmeldung { margin-top: 16px; padding: 12px 14px; border-radius: 14px; font-size: 1.02rem; }
.rueckmeldung.gut { background: var(--gut-hell); color: #0f5a2b; }
.rueckmeldung.schlecht { background: var(--fehler-hell); color: #8a1c13; }
.rueckmeldung.neutral { background: var(--info-hell); color: var(--info); }
.rueckmeldung p { margin: 0; }
.rueckmeldung p + p { margin-top: 6px; }
.rueckmeldung .titel { font-weight: 700; }
.rueckmeldung .klein { font-size: .9rem; }
.aufstieg { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #fff7e0; color: #6b4a00; border: 1px solid #f5d98a; }

.aktionen { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.aktionen:not(:has(button:not([hidden]))) { margin-top: 0; }

/* Knöpfe */
.knopf {
  font: inherit; font-weight: 600; border-radius: 14px; padding: 12px 18px; min-height: 48px;
  border: 2px solid transparent; cursor: pointer; transition: background .15s, transform .05s;
}
.knopf:active { transform: translateY(1px); }
.knopf:focus-visible, .akzent:focus-visible { outline: 3px solid #1e4f86; outline-offset: 2px; }
.knopf.haupt { background: var(--haupt); color: #fff; }
.knopf.haupt:hover { background: var(--haupt-dunkel); }
.knopf.zweit { background: #fff; color: var(--haupt-dunkel); border-color: #f0c9b3; }
.knopf.zweit:hover { background: var(--haupt-hell); }
.knopf.klein { padding: 6px 12px; min-height: 36px; font-size: .9rem; background: var(--haupt-hell); color: var(--haupt-dunkel); border-radius: 10px; }
.knopf.text { background: none; color: var(--text-leise); padding: 8px 10px; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.knopf.text:hover { color: var(--text); }

/* Fuß */
.fuss { text-align: center; }
.sync { font-size: .85rem; color: var(--text-leise); margin: 4px 0 6px; }
.sync.warnung { color: #8a5a00; }
.fuss-knoepfe { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }

/* Dialoge */
.dialog {
  border: none; border-radius: 22px; padding: 22px; width: min(460px, calc(100vw - 24px));
  box-shadow: 0 20px 60px rgba(40, 25, 10, .3); color: var(--text);
}
.dialog.breit { width: min(620px, calc(100vw - 24px)); }
.dialog::backdrop { background: rgba(43, 33, 24, .45); }
.dialog h2 { margin: 0 0 10px; font-size: 1.35rem; }
.dialog h3 { margin: 18px 0 6px; font-size: 1.05rem; }
.dialog label { display: block; font-weight: 600; margin: 10px 0 6px; }
.code-eingabe {
  width: 100%; font-size: 1.3rem; padding: 12px; border-radius: 12px; border: 2px solid var(--linie);
  font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase;
}
.code-eingabe:focus { outline: none; border-color: var(--haupt); }
.dialog-meldung { min-height: 1.4em; margin: 8px 0 0; color: var(--fehler); font-size: .95rem; }
.dialog-meldung.ok { color: var(--gut); }
.dialog-knoepfe { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.dialog-knoepfe.gestapelt { flex-direction: column; }
.dialog-knoepfe.gestapelt .knopf { width: 100%; }
#code-warnung { background: #fff7e0; padding: 10px 12px; border-radius: 10px; font-size: .95rem; }
.regeln { padding-left: 1.2em; margin: 0; }
.regeln li + li { margin-top: 4px; }
.levelliste { padding-left: 0; margin: 0; list-style: none; font-size: .95rem; }
.levelliste li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--linie); }
.levelliste li.aktuell { font-weight: 700; color: var(--haupt-dunkel); }
.levelliste .nr { min-width: 3.2em; color: var(--text-leise); }
.quelle { font-size: .85rem; color: var(--text-leise); }
kbd { font-family: inherit; font-size: .85em; border: 1px solid var(--linie); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: #fff; }

@media (max-width: 480px) {
  .rahmen { padding: 12px 12px 32px; }
  .kopf { flex-direction: column; align-items: stretch; }
  .codebox-zeile { justify-content: space-between; }
  .karte { padding: 16px; }
  .antwort-form { flex-direction: column; }
  .knopf.haupt#pruefen { width: 100%; }
  .aktionen .knopf { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Prüfseite für Lehrkräfte */
.breit-rahmen { max-width: 1100px; }
.kopf a.knopf { text-decoration: none; display: inline-flex; align-items: center; }
.pruef-h2 { font-size: 1.1rem; margin: 18px 0 8px; }
.pruef-h2:first-child { margin-top: 0; }
.pruef-zusammenfassung { display: flex; flex-wrap: wrap; gap: 8px; }
.pruef-zusammenfassung:empty { display: none; }
.zahl { padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: .95rem; }
.zahl.gut { background: var(--gut-hell); color: #0f5a2b; }
.zahl.warn { background: #fff7e0; color: #6b4a00; }
.zahl.fehl { background: var(--fehler-hell); color: #8a1c13; }
.tabelle-huelle { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.pruef-tabelle { border-collapse: collapse; width: 100%; font-size: .95rem; }
.pruef-tabelle th, .pruef-tabelle td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
.pruef-tabelle th { font-size: .8rem; color: var(--text-leise); font-weight: 600; }
.pruef-tabelle tr.warnung td { background: #fff7e0; }
.pruef-tabelle tr.hinweis-zeile td { background: #fff7e0; white-space: normal; color: #6b4a00; font-size: .9rem; }
.pruef-tabelle td.unreg, .unreg-muster { font-weight: 700; color: var(--haupt-dunkel); }
.pruef-fehler { margin: 0; padding-left: 1.2em; }
.pruef-fehler li { background: var(--fehler-hell); color: #8a1c13; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
.pruef-eingabe { width: 100%; min-height: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .95rem; padding: 12px; border-radius: 12px; border: 2px solid var(--linie); }
.pruef-eingabe:focus { outline: none; border-color: var(--haupt); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #f3ede4; padding: 1px 5px; border-radius: 5px; font-size: .92em; }

</head>

      </div>
    </section>
  </div>

    if (!/^[a-zñáéíóúü]+$/.test(inf)) return { fehler: ['Der Infinitiv enthält ungültige Zeichen oder Leerzeichen.'], warnungen: [] };
    var reflexiv = /(ar|er|ir|ír)se$/.test(inf);
    var basis = reflexiv ? inf.slice(0, -2) : inf;
    var endung = ohneAkzent(basis).slice(-2);
    if (!ENDUNGEN[endung]) return { fehler: ['Ein Infinitiv endet auf -ar, -er oder -ir (bzw. -arse, -erse, -irse).'], warnungen: [] };
    if ((gruppe === 'ar' || gruppe === 'er' || gruppe === 'ir') && endung !== gruppe) {
      return { fehler: ['Das Verb endet auf -' + endung + ', steht aber in der Gruppe [' + gruppe + '].'], warnungen: [] };
    }
    if (!yo) return { fehler: ['Die yo-Form fehlt. Schreibe sie hinter ein Semikolon, z. B. „cantar; canto“.'], warnungen: [] };
    if (reflexiv) yo = yo.replace(/^me /, '');
    if (!/^[a-zñáéíóúü]+$/.test(yo)) return { fehler: ['Die yo-Form darf nur ein Wort sein (ohne „yo“; bei reflexiven Verben ohne oder mit „me“).'], warnungen: [] };

    var stamm = basis.slice(0, -2);
    var end = ENDUNGEN[endung];
    var regelYo = stamm + 'o';

    // Stamm für tú, él/ella/usted, ellos/ellas/ustedes
    var schuhStamm = stamm;
    if (gruppe === 'e_ie') schuhStamm = ersetzeLetztes(stamm, 'e', 'ie');
    else if (gruppe === 'o_ue') schuhStamm = ersetzeLetztes(stamm, 'o', 'ue') || ersetzeLetztes(stamm, 'u', 'ue');
    else if (gruppe === 'e_i') schuhStamm = ersetzeLetztes(stamm, 'e', 'i');
    else if (gruppe === 'i_y') {
      schuhStamm = stamm + 'y';
      if (!/(uir|oír|oir)$/.test(basis)) warnungen.push('Zur Gruppe i → y gehören normalerweise Verben auf -uir.');
    }
    if (schuhStamm === null) {
      var vokal = { e_ie: 'e', o_ue: 'o', e_i: 'e' }[gruppe];
      return { fehler: ['Im Stamm „' + stamm + '“ gibt es kein „' + vokal + '“ für den Wechsel. Stimmt die Gruppe?'], warnungen: [] };
    }
    // Akzente aus der yo-Form übernehmen (envío → envías, río → ríes)
    if (/o$/.test(yo)) {
      var yoStamm = yo.slice(0, -1);
      if (yoStamm !== schuhStamm && ohneAkzent(yoStamm) === ohneAkzent(schuhStamm)) schuhStamm = yoStamm;
    }

    var nosotros = stamm + end[3], vosotros = stamm + end[4];
    if (endung === 'ir' && endetMitVokal(stamm)) nosotros = stamm + 'ímos';           // oímos, reímos
    if (!/[aeiouáéíóú]/.test(stamm)) vosotros = stamm + ohneAkzent(end[4]);          // veis, dais
    var formen = [yo, schuhStamm + end[1], schuhStamm + end[2], nosotros, vosotros, schuhStamm + end[5]];

    // Plausibilitätsprüfungen (nur Hinweise)
    if (!/o$/.test(yo) && YO_OHNE_O.indexOf(yo) < 0) warnungen.push('Die yo-Form endet nicht auf -o. Bitte prüfen.');
    var yoRegelmaessig = ohneAkzent(yo) === ohneAkzent(regelYo);
    if ((gruppe === 'ar' || gruppe === 'er' || gruppe === 'ir') && !yoRegelmaessig) {
      warnungen.push('Die yo-Form ist nicht regelmäßig (regelmäßig wäre „' + regelYo + '“). Gehört das Verb in die Gruppe [1. Person]? Bei reinen Schreibänderungen wie cojo oder venzo ist es richtig so.');
    }
    if (gruppe === 'yo_irregular' && yoRegelmaessig) {
      warnungen.push('Die yo-Form ist regelmäßig. Gehört das Verb wirklich in die Gruppe [1. Person]?');
    }
    if ((gruppe === 'e_ie' || gruppe === 'o_ue' || gruppe === 'e_i') && yoRegelmaessig) {
      warnungen.push('Die yo-Form zeigt keinen Stammwechsel. Stimmt die Gruppe?');
    }

    if (reflexiv) formen = formen.map(function (f, i) { return REFLEXIV[i] + ' ' + f; });
    var verb = { infinitiv: inf, gruppe: gruppe, formen: {}, reflexiv: reflexiv, zusatz: true, abweichend_von_regel: [] };
    var regel = [regelYo].concat(end.slice(1).map(function (e) { return stamm + e; }));
    FORM_SCHLUESSEL.forEach(function (k, i) {
      verb.formen[k] = formen[i];
      var ohneRefl = reflexiv ? formen[i].split(' ')[1] : formen[i];
      if (ohneAkzent(ohneRefl) !== ohneAkzent(regel[i])) verb.abweichend_von_regel.push(k);
    });
    return { fehler: fehler, warnungen: warnungen, verb: verb };
  }

  /* Liest den Text von zusatzverben.txt.
     Ergebnis: { verben: [...], zeilen: [{ nr, text, gruppe, status: 'ok'|'warnung'|'fehler', meldungen, verb }] } */
  function leseZusatzverben(text, basisVerben) {
    var bekannt = {};
    (basisVerben || []).forEach(function (v) { bekannt[v.infinitiv] = 'in der Original-Tabelle'; });
    var gruppe = null, zeilen = [], verben = [];
    String(text || '').replace(/^﻿/, '').split(/\r?\n/).forEach(function (roh, index) {
      var zeile = roh.trim();
      if (!zeile || zeile.charAt(0) === '#') return;
      var nr = index + 1;
      var kopf = zeile.match(/^\[(.*)\]$/);
      if (kopf) {
        gruppe = gruppeAusUeberschrift(kopf[1]);
        if (!gruppe) zeilen.push({ nr: nr, text: zeile, gruppe: null, status: 'fehler', meldungen: ['Unbekannte Gruppe. Erlaubt sind: [ar], [er], [ir], [1. Person], [e-ie], [o-ue], [e-i], [i-y].'] });
        return;
      }
      var eintrag = { nr: nr, text: zeile, gruppe: gruppe, status: 'ok', meldungen: [] };
      zeilen.push(eintrag);
      if (!gruppe) { eintrag.status = 'fehler'; eintrag.meldungen.push('Die Zeile steht unter keiner gültigen Gruppen-Überschrift.'); return; }
      var teile = zeile.split(/\s*[;,:=\t]\s*/).filter(function (t) { return t !== ''; });
      if (teile.length > 2) { eintrag.status = 'fehler'; eintrag.meldungen.push('Bitte nur Infinitiv und yo-Form angeben, z. B. „cantar; canto“.'); return; }
      var r = bildeFormen(teile[0], gruppe, teile[1] || '');
      if (r.fehler.length) { eintrag.status = 'fehler'; eintrag.meldungen = r.fehler; return; }
      if (bekannt[r.verb.infinitiv]) {
        eintrag.status = 'fehler';
        eintrag.meldungen.push('„' + r.verb.infinitiv + '“ ist schon ' + bekannt[r.verb.infinitiv] + ' enthalten.');
        return;
      }
      bekannt[r.verb.infinitiv] = 'weiter oben in dieser Datei (Zeile ' + nr + ')';
      if (r.warnungen.length) { eintrag.status = 'warnung'; eintrag.meldungen = r.warnungen; }
      eintrag.verb = r.verb;
      verben.push(r.verb);
    });
    return { verben: verben, zeilen: zeilen };
  }

  function verbenMitZusatz(basisDaten, zusatzText) {
    var z = leseZusatzverben(zusatzText, basisDaten.verben);
    return { verben: basisDaten.verben.concat(z.verben), zusatz: z };
  }

  var Logik = {
    PRONOMEN: PRONOMEN, PRONOMEN_FORM: PRONOMEN_FORM, GRUPPEN: GRUPPEN, LEVEL: LEVEL, LEVEL_IDS: LEVEL_IDS,
    SERIE_ZIEL: SERIE_ZIEL, levelInfo: levelInfo, naechstesLevel: naechstesLevel,
    pronomenGewichte: pronomenGewichte, Generator: Generator, aufgabenText: aufgabenText,
    pruefe: pruefe, normalisiere: normalisiere, neuerLernstand: neuerLernstand,
    werteErstantwortAus: werteErstantwortAus, erzeugeCode: erzeugeCode, bereinigeCode: bereinigeCode,
    zeigeCode: zeigeCode, bildeFormen: bildeFormen, leseZusatzverben: leseZusatzverben,
    verbenMitZusatz: verbenMitZusatz, ZUSATZ_UEBERSCHRIFT: ZUSATZ_UEBERSCHRIFT
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Logik;
  else global.Logik = Logik;
})(this);
</script>
  <script>
  (function () {
    'use strict';
    var L = window.Logik;
    var SPALTEN = ['yo', 'tú', 'él/ella/usted', 'nosotros', 'vosotros', 'ellos/ellas/ustedes'];
    var SCHLUESSEL = ['yo', 'tu', 'el', 'nosotros', 'vosotros', 'ellos'];
    var GRUPPEN_REIHE = ['ar', 'er', 'ir', 'yo_irregular', 'e_ie', 'o_ue', 'e_i', 'i_y'];
    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function $(id) { return document.getElementById(id); }

    function zeige(text) {
      var r = L.leseZusatzverben(text, window.VERBDATEN.verben);
      var ok = r.zeilen.filter(function (z) { return z.status === 'ok'; }).length;
      var warn = r.zeilen.filter(function (z) { return z.status === 'warnung'; }).length;
      var fehl = r.zeilen.filter(function (z) { return z.status === 'fehler'; });
      $('zusammenfassung').innerHTML =
        '<span class="zahl gut">' + (ok + warn) + ((ok + warn) === 1 ? ' Verb' : ' Verben') + ' übernommen</span>' +
        (warn ? '<span class="zahl warn">' + warn + ' davon bitte prüfen</span>' : '') +
        (fehl.length ? '<span class="zahl fehl">' + fehl.length + (fehl.length === 1 ? ' Zeile' : ' Zeilen') + ' nicht übernommen</span>' : '');

      var html = '';
      if (fehl.length) {
        html += '<h2 class="pruef-h2">Nicht übernommen</h2><ul class="pruef-fehler">' + fehl.map(function (z) {
          return '<li><strong>Zeile ' + z.nr + ':</strong> <code>' + esc(z.text) + '</code><br>' + z.meldungen.map(esc).join('<br>') + '</li>';
        }).join('') + '</ul>';
      }
      GRUPPEN_REIHE.forEach(function (g) {
        var zeilen = r.zeilen.filter(function (z) { return z.verb && z.verb.gruppe === g; });
        if (!zeilen.length) return;
        html += '<h2 class="pruef-h2">' + esc(L.ZUSATZ_UEBERSCHRIFT[g]) + ' ' + esc(L.GRUPPEN[g].name) + '</h2>' +
          '<div class="tabelle-huelle"><table class="pruef-tabelle"><thead><tr><th>Zeile</th><th>Verb</th>' +
          SPALTEN.map(function (s) { return '<th>' + s + '</th>'; }).join('') + '</tr></thead><tbody>' +
          zeilen.map(function (z) {
            return '<tr class="' + z.status + '"><td>' + z.nr + '</td><td><strong>' + esc(z.verb.infinitiv) + '</strong></td>' +
              SCHLUESSEL.map(function (k) {
                var unreg = z.verb.abweichend_von_regel.indexOf(k) >= 0;
                return '<td' + (unreg ? ' class="unreg" title="weicht von der regelmäßigen Bildung ab"' : '') + ' lang="es">' + esc(z.verb.formen[k]) + '</td>';
              }).join('') + '</tr>' +
              (z.meldungen.length ? '<tr class="hinweis-zeile"><td></td><td colspan="7">⚠ ' + z.meldungen.map(esc).join('<br>⚠ ') + '</td></tr>' : '');
          }).join('') + '</tbody></table></div>';
      });
      if (!r.zeilen.length) html = '<p>Die Datei enthält noch keine Zusatzverben.</p>';
      else html += '<p class="quelle"><span class="unreg-muster">Fett</span> = Form weicht von der regelmäßigen Bildung ab (wichtig für die Gewichtung der Aufgaben).</p>';
      $('ergebnis').innerHTML = html;
    }

    $('pruefen-knopf').addEventListener('click', function () { zeige($('eingabe').value); });

    if (location.protocol === 'file:') {
      $('lade-status').textContent = 'Die Seite ist direkt vom Computer geöffnet, deshalb kann sie zusatzverben.txt nicht selbst laden. Füge den Inhalt der Datei unten ein und klicke auf „Prüfen“.';
      zeige('');
      return;
    }
    fetch('zusatzverben.txt', { cache: 'no-cache' }).then(function (a) {
      if (!a.ok) throw new Error('Status ' + a.status);
      return a.text();
    }).then(function (text) {
      $('lade-status').innerHTML = 'Geprüft wird die veröffentlichte Datei <code>zusatzverben.txt</code> (Stand: ' +
        new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr). ' +
        'Nach einer Änderung auf GitHub dauert es 1–2 Minuten, bis sie hier erscheint. Dann Seite neu laden.';
      $('eingabe').value = text;
      zeige(text);
    }).catch(function (f) {
      $('lade-status').textContent = 'zusatzverben.txt konnte nicht geladen werden (' + f.message + '). Liegt die Datei im selben Ordner wie die App?';
      zeige('');
    });
  })();
  </script>
